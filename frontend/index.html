<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Catálogo de productos tecnológicos</h1>

  <!-- Formulario: sirve para crear y para editar -->
  <form id="form-producto">
    <label>Nombre* <input type="text" id="nombre" required></label>
    <label>Marca* <input type="text" id="marca" required></label>
    <label>Categoría
      <select id="categoria">
        <option value="portátil">Portátil</option>
        <option value="móvil">Móvil</option>
        <option value="tablet">Tablet</option>
        <option value="accesorio">Accesorio</option>
        <option value="otro" selected>Otro</option>
      </select>
    </label>
    <label>Precio* <input type="number" id="precio" min="0" step="0.01" required></label>
    <label>Stock <input type="number" id="stock" min="0" step="1"></label>
    <label>Descripción <textarea id="descripcion"></textarea></label>

    <button type="submit">Guardar</button>
    <button type="button" id="btn-cancelar">Cancelar</button>
  </form>

  <!-- Listado de productos -->
  <table>
    <thead>
      <tr>
        <th>Nombre</th><th>Marca</th><th>Categoría</th>
        <th>Precio</th><th>Stock</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody id="lista-productos">
      <tr><td colspan="6">No hay productos</td></tr>
    </tbody>
  </table>

  <!-- Panel de detalle (se rellena al pulsar "Ver") -->
  <section id="detalle"></section>

  <script src="app.js"></script>
</body>
</html>
